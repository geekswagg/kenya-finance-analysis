name: Data quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s pipeline
      - run: python pipeline/validate.py
      - run: python scripts/build.py
      - run: python scripts/validate.py
      - run: git diff --exit-code -- data/processed data/metadata
